params:
  - { name: SND_OFFSET,  value: "(`SND_START-`JTFRAME_BA1_START)>>1" }
  - { name: PCM0_OFFSET, value: "(`PCM0_START-`JTFRAME_BA1_START)>>1" }
  - { name: PCM1_OFFSET, value: "(`PCM1_START-`JTFRAME_BA1_START)>>1" }
  - { name: OBJ_OFFSET,  value: "(`OBJ_START-`JTFRAME_BA2_START)>>1" }
  - { name: PF3_OFFSET,  value: "(`PF3_START-`JTFRAME_BA3_START)>>1" }
clocks:
  clk48:
    - freq: 8000000
      outputs:
        - cpu_cen
    - freq: 12000000
      outputs:
        - cen12
        - cen6
    - freq: 3579545
      outputs:
        - cen_fm
        - cen_fm2
    - freq: 375000
      outputs:
        - cen375

audio:
  rsum: 2.4k
  gain: 0.3092
  channels:
    - { name: fm0,  module: jt03_fm,  rsum: 7.5k, rc: [{ r: rout, c: 1n }] }
    - { name: psg0, module: jt03_psg, rsum: 7.5k }
    - { name: fm1,  module: jt03_fm,  rsum: 7.5k, rc: [{ r: rout, c: 1n }] }
    - { name: psg1, module: jt03_psg, rsum: 7.5k }
    - { name: pcm0, module: jt5205,   rsum: 2.8k, rc: [{ r: 7k, c: 22n }, { r: 10k, c: 22n }] }
    - { name: pcm1, module: jt5205,   rsum: 2.8k, rc: [{ r: 7k, c: 22n }, { r: 10k, c: 22n }] }
sdram:
  banks:

    - buses:
        - { name: main, addr_width: 18, data_width: 16 }

    - buses:
        - { name: sub,  addr_width: 17, data_width: 16 }
        - { name: snd,  addr_width: 17, data_width: 8, offset: SND_OFFSET }
        - { name: pcm0, addr_width: 16, data_width: 8, offset: PCM0_OFFSET }
        - { name: pcm1, addr_width: 16, data_width: 8, offset: PCM1_OFFSET }

    - buses:
        - { name: pf1rom, addr_width: 20, data_width: 32 }
        - { name: objrom, addr_width: 19, data_width: 32, offset: OBJ_OFFSET }

    - buses:
        - { name: pf2rom, addr_width: 18, data_width: 32 }
        - { name: pf3rom, addr_width: 18, data_width: 32, offset: PF3_OFFSET }
bram:

  - name: chars
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
  - name: map1hi
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
  - name: map1lo
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
  - name: map2hi
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
  - name: map2lo
    addr_width: 15
    data_width: 8
    prom: true
    simfile: {}
